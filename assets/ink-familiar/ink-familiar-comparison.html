<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ink Familiar - Comparison</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #EAE6DF;
            color: #333;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            display: flex;
            gap: 40px;
        }
        .panel {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 {
            font-size: 14px;
            opacity: 0.6;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <h1>Ink Familiar Vector Pass</h1>
    <div class="container">
        <div class="panel">
            <h2>Rejected V1</h2>
            <img src="ink-familiar-master.svg" width="400" height="400" alt="V1">
        </div>
        <div class="panel">
            <h2>High Fidelity V2</h2>
            <img src="ink-familiar-master-v2.svg" width="400" height="400" alt="V2">
        </div>
    </div>
</body>
</html>
