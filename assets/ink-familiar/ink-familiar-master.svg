<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Basic drop shadow for depth if needed, though mostly flat is preferred -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g id="InkFamiliar">
    
    <!-- INK EFFECTS (Background Layer) -->
    <g id="Ink">
      <path id="Tail_Main" fill="#1A1A1A" d="M 280,320 C 370,330 450,290 480,200 C 490,170 450,130 410,150 C 380,165 410,210 380,260 C 350,300 310,300 280,300 Z" />
      <path id="Wisp_01" fill="#1A1A1A" d="M 310,340 C 370,390 450,420 490,370 C 500,350 460,350 440,370 C 400,400 350,370 315,345 Z" />
      <path id="Wisp_02" fill="#1A1A1A" d="M 170,350 C 100,350 40,300 20,240 C 10,200 40,180 60,200 C 50,230 70,270 120,300 C 140,320 160,330 170,330 Z" />
      <path id="Wisp_03" fill="#1A1A1A" d="M 140,240 C 90,230 50,190 40,140 C 35,110 60,100 70,120 C 65,140 80,170 110,190 C 125,205 135,215 140,230 Z" />
      <path id="Droplet_01" fill="#1A1A1A" d="M 440,110 C 448,125 452,135 448,142 C 442,150 432,150 428,142 C 425,135 432,125 440,110 Z" />
      <path id="Droplet_02" fill="#1A1A1A" d="M 60,130 C 65,140 68,148 65,152 C 61,158 55,158 52,152 C 50,148 55,140 60,130 Z" />
      <path id="Droplet_03" fill="#1A1A1A" d="M 480,270 C 485,280 488,288 485,292 C 481,298 475,298 472,292 C 470,288 475,280 480,270 Z" />
    </g>

    <!-- BODY -->
    <g id="Body">
      <path id="Hindpaw_R" fill="#1A1A1A" d="M 165,370 C 145,385 145,410 165,415 C 185,420 195,400 195,385 Z" />
      <path id="Hindpaw_L" fill="#1A1A1A" d="M 275,360 C 285,385 305,400 325,390 C 345,380 330,355 310,345 Z" />
      <path id="Torso" fill="#1A1A1A" d="M 180,265 C 150,310 160,370 210,385 C 260,400 300,360 290,290 C 285,260 250,265 220,260 C 200,255 190,250 180,265 Z" />
      <path id="Forepaw_R" fill="#1A1A1A" d="M 185,340 C 150,350 140,370 150,385 C 160,400 185,395 195,370 Z" />
      <path id="Forepaw_L" fill="#1A1A1A" d="M 235,365 C 230,395 245,410 265,405 C 285,400 280,380 270,360 Z" />
    </g>

    <!-- SCARF (Overlap between Body and Head) -->
    <g id="Scarf">
      <path id="Scarf_Tail_02" fill="#B22234" d="M 290,295 C 310,320 330,340 360,350 C 370,355 340,365 315,345 C 295,325 285,305 290,295 Z" />
      <path id="Scarf_Tail_01" fill="#B22234" d="M 285,290 C 320,295 350,280 380,290 C 390,295 360,315 330,310 C 300,305 290,300 285,290 Z" />
      <path id="Scarf_Neck" fill="#B22234" d="M 175,275 C 210,295 260,295 295,275 C 305,285 270,315 220,315 C 180,315 165,290 175,275 Z" />
    </g>

    <!-- HEAD -->
    <g id="Head">
      <path id="Ear_L" fill="#1A1A1A" d="M 270,180 C 290,130 330,80 350,40 C 340,70 330,90 320,120 C 360,90 390,70 410,60 C 380,110 340,140 310,195 Z" />
      <path id="Head_Ink" fill="#1A1A1A" d="M 236,110 C 290,110 330,140 330,200 C 330,260 290,290 236,290 C 180,290 140,260 140,200 C 140,140 180,110 236,110 Z" />
      <path id="Ear_R" fill="#1A1A1A" d="M 190,175 C 170,120 130,80 150,40 C 160,60 170,80 180,100 C 200,60 210,40 230,30 C 220,70 220,110 235,160 Z" />
      
      <path id="Face_Cream" fill="#F5EDE3" d="M 225,175 C 245,155 285,155 300,190 C 315,230 280,270 235,275 C 190,280 140,250 155,210 C 165,180 195,165 225,175 Z" />
      
      <ellipse id="Eye_R" cx="185" cy="215" rx="14" ry="22" transform="rotate(-10 185 215)" fill="#1A1A1A" />
      <g id="EyeHighlight_R">
        <ellipse cx="182" cy="205" rx="5" ry="7" fill="#FFFFFF" transform="rotate(-10 182 205)" />
        <ellipse cx="188" cy="225" rx="2" ry="3" fill="#FFFFFF" />
      </g>
      
      <ellipse id="Eye_L" cx="255" cy="220" rx="22" ry="28" transform="rotate(-5 255 220)" fill="#1A1A1A" />
      <g id="EyeHighlight_L">
        <ellipse cx="248" cy="208" rx="8" ry="11" fill="#FFFFFF" transform="rotate(-5 248 208)" />
        <ellipse cx="262" cy="235" rx="3" ry="4" fill="#FFFFFF" />
      </g>
      
      <path id="Mouth" fill="#2D2D2D" d="M 210,248 Q 215,253 220,248 Q 215,255 210,248 Z" />
    </g>

    <!-- PROPS -->
    <g id="Props" display="none">
      <g id="Notebook">
        <path d="M 210,340 L 250,330 L 260,370 L 220,380 Z" fill="#2D2D2D" />
        <path d="M 215,342 L 245,335" stroke="#F5EDE3" stroke-width="2" />
        <path d="M 217,350 L 247,343" stroke="#F5EDE3" stroke-width="2" />
      </g>
      <g id="MagnifyingGlass">
        <path d="M 260,350 L 280,370" stroke="#6B6B6B" stroke-width="4" stroke-linecap="round" />
        <circle cx="285" cy="375" r="15" stroke="#F5EDE3" stroke-width="3" fill="none" />
      </g>
    </g>
    
  </g>
</svg>
